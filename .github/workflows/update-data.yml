name: Validate public debt data

on:
  workflow_dispatch:
    inputs:
      verify_public_endpoint:
        description: Compare the public R2 endpoint with the local build
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      public_endpoint_max_age_hours:
        description: Maximum accepted age for the public endpoint
        required: false
        default: "168"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: update-public-debt-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Build datasets
        run: |
          python scripts/build_all_datasets.py

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-debt-quality-report
          path: |
            output/data/pipeline_run_metadata.json
            output/data/quality/validation_report.csv
            output/data/quality/validation_report.json
            output/data/quality/validation_summary.json
            output/data/public/debito-pubblico.json
          if-no-files-found: ignore

      - name: Verify public endpoint
        if: ${{ inputs.verify_public_endpoint == 'true' }}
        env:
          PUBLIC_ENDPOINT_MAX_AGE_HOURS: ${{ inputs.public_endpoint_max_age_hours }}
        run: python scripts/verify_public_endpoint.py
